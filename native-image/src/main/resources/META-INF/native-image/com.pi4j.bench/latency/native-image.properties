# AOT args that travel with the image so a standalone `native-image -cp ...` build (no
# Gradle) matches the Gradle lane. Kept in sync with graalvmNative.binaries.main.buildArgs
# in native-image/build.gradle.kts. Pi4J opens native fds / parses /proc at runtime, so
# its provider + boardinfo packages must initialize at run time, never at build.
Args = --enable-native-access=ALL-UNNAMED \
       -H:+UnlockExperimentalVMOptions \
       --initialize-at-run-time=com.pi4j.plugin.ffm,com.pi4j.boardinfo
