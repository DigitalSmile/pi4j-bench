# SLF4J SimpleLogger — quiet on the hot path, but NOT silent.
# `error` prints nothing during normal setup/measurement (Pi4J logs info/debug there),
# yet still surfaces real failures. Using `off` hid a swallowed provider-init error
# (Pi4J's provider loop logs the cause at ERROR then continues), which then only
# showed up much later as a confusing ProviderNotFoundException. Never hide errors.
# Override per-run with -Dorg.slf4j.simpleLogger.defaultLogLevel=warn|info when debugging.
org.slf4j.simpleLogger.defaultLogLevel=off
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=true
